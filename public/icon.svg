<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Shield Base Shape -->
  <g filter="url(#glow)">
    <path d="M 256 90 
             C 340 90, 395 125, 395 125
             C 395 270, 310 380, 256 422
             C 202 380, 117 270, 117 125
             C 117 125, 172 90, 256 90 Z" 
          fill="#111827" 
          stroke="url(#shieldGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />
  </g>

  <!-- Inner Safe / Vault Door Elements -->
  <circle cx="256" cy="245" r="76" fill="#1f2937" stroke="#374151" stroke-width="6" />
  <circle cx="256" cy="245" r="54" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 8" />

  <!-- Padlock or Target Center Symbol -->
  <!-- Lock Shackle -->
  <path d="M 236 230 V 215 C 236 204, 245 195, 256 195 C 267 195, 276 204, 276 215 V 230" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="6" 
        stroke-linecap="round" />
  <!-- Lock Body -->
  <rect x="228" y="230" width="56" height="42" rx="8" fill="url(#shieldGrad)" />
  <!-- Keyhole -->
  <circle cx="256" cy="248" r="4" fill="#0f172a" />
  <path d="M 254 250 L 253 260 H 259 L 258 250 Z" fill="#0f172a" />

  <!-- Growth Spark / Secure Check Star -->
  <path d="M 256 312 L 262 328 L 278 334 L 262 340 L 256 356 L 250 340 L 234 334 L 250 328 Z" fill="#10b981" opacity="0.9" />

  <!-- FCFA Typography Accent -->
  <text x="256" y="465" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="4">SECURITY FUND</text>
</svg>
